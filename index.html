<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>需求工作台</title>
  <style>
    :root { --ui-scale:.9; --ink:#24312d; --muted:#71807a; --line:#e1e9e5; --surface:#ffffff; --canvas:#fafcfb; --sidebar:#edf3f0; --sidebar-strong:#dfeae5; --accent:#d98263; --focus:#377b66; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:111.112vh; zoom:var(--ui-scale); background:var(--canvas); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; }
    .shell { position:relative; display:grid; grid-template-columns:264px minmax(0,1fr); min-height:111.112vh; transition:grid-template-columns .36s cubic-bezier(.2,0,0,1); }
    .shell.sidebar-collapsed { grid-template-columns:0 minmax(0,1fr); }
    .sidebar { min-width:0; overflow:hidden; background:var(--sidebar); color:var(--ink); padding:28px 16px; display:flex; flex-direction:column; border-right:1px solid var(--line); opacity:1; transform:translateX(0); transition:opacity .22s ease,transform .36s cubic-bezier(.2,0,0,1),padding .36s cubic-bezier(.2,0,0,1),border-color .2s ease; }
    .shell.sidebar-collapsed .sidebar { padding-inline:0; border-color:transparent; opacity:0; transform:translateX(-100%); pointer-events:none; }
    .brand { display:flex; align-items:center; gap:12px; padding:0 10px 34px; }
    .brand,.tree { width:232px; flex-shrink:0; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:8px; background:var(--accent); color:#fff; font-weight:750; box-shadow:0 5px 14px rgba(217,130,99,.18); }
    .brand-title { font-size:15px; font-weight:700; }
    .tree { flex:1; }
    .date-row { width:100%; min-height:44px; display:flex; align-items:center; gap:9px; padding:10px 12px; border:0; border-radius:8px; background:transparent; color:#66756f; font-size:12px; font-weight:650; text-align:left; cursor:pointer; transition:background .18s ease,color .18s ease; }
    .date-row:hover { background:rgba(255,255,255,.56); color:var(--ink); }
    .date-row:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .date-row__icon { color:var(--accent); font-size:10px; transform:rotate(0); transition:transform .28s cubic-bezier(.2,0,0,1); }
    .date-row[aria-expanded="false"] .date-row__icon { transform:rotate(-90deg); }
    .req-list { display:grid; gap:5px; max-height:160px; margin-top:4px; overflow:hidden; opacity:1; transform:translateY(0); transition:max-height .3s cubic-bezier(.2,0,0,1),opacity .2s ease,transform .3s cubic-bezier(.2,0,0,1),margin .3s ease; }
    .req-list.is-hidden { max-height:0; margin-top:0; opacity:0; transform:translateY(-6px); pointer-events:none; }
    .req-btn { position:relative; width:100%; min-height:44px; border:0; border-radius:8px; padding:11px 14px 11px 32px; background:transparent; color:#53635d; text-align:left; cursor:pointer; transition:background .18s ease,color .18s ease,transform .18s ease; }
    .req-btn::before { content:""; position:absolute; left:14px; top:50%; width:5px; height:5px; border-radius:50%; background:#a5b5ae; transform:translateY(-50%); }
    .req-btn:hover { background:rgba(255,255,255,.72); color:var(--ink); transform:translateX(2px); }
    .req-btn:active { transform:scale(.98); }
    .req-btn:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    .req-btn.active { background:var(--surface); color:var(--ink); font-weight:700; box-shadow:0 4px 18px rgba(51,73,65,.07); }
    .req-btn.active::before { background:var(--accent); }
    .sidebar-toggle { position:fixed; z-index:10; top:50%; left:240px; width:36px; height:36px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; background:rgba(255,255,255,.92); color:#5f7069; cursor:pointer; box-shadow:0 6px 20px rgba(51,73,65,.10); transform:translateY(-50%); transition:left .36s cubic-bezier(.2,0,0,1),background .18s ease,transform .18s ease; }
    .sidebar-toggle:hover { background:#fff; transform:translateY(-50%) translateY(-1px); }
    .sidebar-toggle:active { transform:translateY(-50%) scale(.94); }
    .sidebar-toggle:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
    .sidebar-toggle__icon { display:block; font-size:24px; line-height:1; transform:translateX(-1px) rotate(0); transition:transform .36s cubic-bezier(.2,0,0,1); }
    .shell.sidebar-collapsed .sidebar-toggle { left:18px; }
    .shell.sidebar-collapsed .sidebar-toggle__icon { transform:translateX(1px) rotate(180deg); }
    .main { padding:clamp(28px,6vw,78px); background:var(--canvas); }
    .content { max-width:1320px; margin:0 auto; }
    .eyebrow { color:var(--muted); font-size:12px; font-weight:600; }
    h1 { margin:16px 0 28px; font-size:clamp(30px,4vw,46px); line-height:1.16; font-weight:680; }
    .rule { width:100%; height:1px; background:var(--line); transform-origin:left; animation:reveal .45s ease both; }
    .content-view { animation:enter .28s ease both; }
    .prototype-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:28px; }
    .prototype-heading h1 { margin:10px 0 0; font-size:32px; }
    .prototype-path { display:none; }
    .prd-document { max-width:920px; margin-bottom:44px; }
    .prd-module { margin-bottom:30px; }
    .prd-module:last-child { margin-bottom:0; }
    .prd-module h2 { position:relative; margin:0 0 12px; padding-left:13px; color:#33453e; font-size:16px; font-weight:750; }
    .prd-module h2::before { content:""; position:absolute; left:0; top:3px; bottom:3px; width:3px; border-radius:3px; background:var(--accent); }
    .prd-module__content { padding-left:13px; color:#52615b; font-size:14px; line-height:1.85; }
    .prd-module__content p { margin:0; }
    .prd-module__content p + p { margin-top:8px; }
    .prototype-section-title { margin:0 0 16px; color:#33453e; font-size:18px; font-weight:750; }
    .migration-document { max-width:980px; padding-bottom:40px; }
    .migration-lead { margin:18px 0 38px; color:#52615b; font-size:16px; line-height:1.85; }
    .migration-section { margin:0 0 34px; }
    .migration-section h2 { display:flex; align-items:center; gap:10px; margin:0 0 14px; color:#33453e; font-size:18px; }
    .migration-section h2::before { content:""; width:4px; height:19px; border-radius:4px; background:var(--accent); }
    .migration-section p { margin:0; color:#52615b; font-size:14px; line-height:1.9; }
    .migration-section p + p { margin-top:9px; }
    .fact-note { display:inline-flex; align-items:center; min-height:28px; margin-bottom:14px; padding:0 10px; border-radius:5px; background:#e9f5ef; color:#2f7559; font-size:12px; font-weight:700; }
    .flowchart-scroll { overflow-x:auto; padding:4px 0 14px; scrollbar-color:#b8cbc1 transparent; }
    .flowchart-board { position:relative; width:1760px; height:450px; border:1px solid #e0eae5; border-radius:8px; background:#fbfdfb; overflow:hidden; }
    .flowchart-board::before { content:""; position:absolute; inset:0; background-image:radial-gradient(#dce8e1 1px, transparent 1px); background-size:16px 16px; opacity:.5; }
    .flowchart-svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .flowchart-svg path { fill:none; stroke:#80a393; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .flowchart-svg .flow-return { stroke:#d48a71; stroke-dasharray:5 5; }
    .flowchart-svg text { fill:#7d9388; font-family:"Microsoft YaHei", sans-serif; font-size:11px; font-weight:700; }
    .flow-node { position:absolute; z-index:1; width:154px; min-height:78px; display:flex; flex-direction:column; justify-content:center; padding:14px 14px 13px; box-sizing:border-box; border:1px solid #cfe0d7; border-radius:7px; background:#fff; color:#52615b; box-shadow:0 2px 8px rgba(38,75,58,.05); font-size:12px; line-height:1.55; text-align:center; }
    .flow-node strong { display:block; color:#35473f; font-size:13px; line-height:1.45; }
    .flow-node small { display:block; margin-top:5px; color:#70847a; font-size:11px; line-height:1.45; }
    .flow-node.start, .flow-node.done { width:110px; min-height:48px; padding:11px 10px; border-radius:999px; background:#e9f5ef; border-color:#b9dac7; color:#2f7559; font-weight:750; }
    .flow-node.decision { width:126px; min-height:126px; padding:22px 16px; border-radius:0; border-color:#e0c687; background:#fffaf0; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); box-shadow:none; }
    .flow-node.decision strong { font-size:12px; }
    .flow-node.failure { width:180px; min-height:70px; border-color:#edc7b8; background:#fff8f5; color:#a7654c; }
    .flow-node.failure strong { color:#9c5a43; }
    .flow-node.failure small { color:#ad765f; }
    .flow-node:hover { transform:translateY(-2px); box-shadow:0 5px 14px rgba(38,75,58,.10); transition:transform 180ms ease, box-shadow 180ms ease; }
    .interaction-flow { position:relative; width:min(100%,975px); margin:0 auto; border:1px solid #dfe6e3; border-radius:8px; overflow:hidden; background:#fff; box-shadow:0 14px 36px rgba(43,63,56,.08); }
    .interaction-flow img { display:block; width:100%; height:auto; }
    .migration-entry-btn { position:absolute; left:38%; top:42%; min-height:34px; padding:0 14px; border:1px solid #3d86b4; border-radius:4px; background:#f9fdff; color:#23648c; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 2px 8px rgba(35,100,140,.16); }
    .migration-entry-btn:hover { background:#eaf6fd; transform:translateY(-1px); }
    .migration-entry-btn:active { transform:scale(.98); }
    .migration-entry-btn:focus-visible { outline:2px solid #377b66; outline-offset:3px; }
    .migration-modal-backdrop { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:24px; background:rgba(29,46,39,.28); opacity:0; pointer-events:none; transition:opacity .2s ease; }
    .migration-modal-backdrop.is-open { opacity:1; pointer-events:auto; }
    .migration-modal { width:min(520px,100%); padding:24px; border:1px solid #dfe8e3; border-radius:10px; background:#fff; box-shadow:0 24px 70px rgba(27,48,39,.22); transform:translateY(8px) scale(.98); transition:transform .22s ease; }
    .migration-modal-backdrop.is-open .migration-modal { transform:translateY(0) scale(1); }
    .migration-modal__head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
    .migration-modal__head h3 { margin:0; color:#33453e; font-size:19px; }
    .migration-modal__close { width:32px; height:32px; border:0; border-radius:50%; background:#f1f6f3; color:#63756d; cursor:pointer; font-size:19px; line-height:1; }
    .migration-modal__close:hover { background:#e5eee9; }
    .migration-modal__body { display:grid; gap:14px; }
    .migration-modal__field { color:#52615b; font-size:13px; }
    .migration-modal__field input, .migration-modal__field select { display:block; width:100%; height:42px; margin-top:7px; padding:0 12px; border:1px solid #dfe7e3; border-radius:6px; background:#f8fbf9; color:#405149; }
    .migration-modal__action { width:max-content; min-height:40px; margin-top:4px; padding:0 18px; border:0; border-radius:6px; background:#377b66; color:#fff; font-weight:700; cursor:pointer; }
    .migration-workbench { width:min(1160px,calc(100vw - 48px)); max-height:calc(100vh - 48px); padding:0; overflow:auto; }
    .migration-workbench .migration-modal__head { position:sticky; z-index:4; top:0; margin:0; padding:18px 22px; border-bottom:1px solid #e3ebe7; background:rgba(255,255,255,.96); }
    .migration-workbench__layout { position:relative; display:grid; grid-template-columns:minmax(0,760px) minmax(280px,1fr); min-height:650px; }
    .migration-config-pane { padding:20px 22px 22px; border-right:1px solid #e4ebe8; background:#fff; }
    .migration-dev-pane { position:relative; padding:20px 18px; background:#f7faf8; }
    .migration-dev-pane h4 { margin:0 0 14px; color:#62736b; font-size:12px; }
    .migration-summary { display:grid; grid-template-columns:1fr 1fr 1.15fr; border:1px solid #dfe8e3; border-radius:8px; overflow:hidden; }
    .migration-metric { min-height:86px; padding:14px 16px; border-right:1px solid #e4ebe8; background:#fbfdfc; }
    .migration-metric:last-child { border-right:0; background:#f0f7f3; }
    .migration-metric span { display:block; color:#78877f; font-size:11px; }
    .migration-metric strong { display:block; margin-top:6px; color:#33473f; font-size:19px; }
    .migration-metric small { display:block; margin-top:4px; color:#7b8a83; font-size:10px; }
    .migration-block-title { display:flex; align-items:center; justify-content:space-between; margin:20px 0 10px; }
    .migration-block-title strong { color:#394a43; font-size:14px; }
    .migration-block-title span { color:#7c8b84; font-size:11px; }
    .disk-list { border:1px solid #dfe7e3; border-radius:8px; overflow:hidden; }
    .disk-option { position:relative; display:grid; grid-template-columns:34px 78px minmax(150px,1fr) 190px 94px; align-items:center; min-height:72px; padding:0 14px; border:0; border-bottom:1px solid #e6ece9; background:#fff; color:#43534c; text-align:left; cursor:pointer; }
    .disk-option:last-child { border-bottom:0; }
    .disk-option:hover:not(:disabled) { background:#f7fbf9; }
    .disk-option.is-selected { background:#eef7f2; box-shadow:inset 3px 0 #377b66; }
    .disk-option:disabled { background:#f5f6f5; color:#98a39e; cursor:not-allowed; }
    .disk-radio { width:16px; height:16px; border:1.5px solid #9cafA5; border-radius:50%; }
    .is-selected .disk-radio { border:5px solid #377b66; }
    .disk-name { font-size:17px; font-weight:750; }
    .disk-meta strong { display:block; color:inherit; font-size:12px; }
    .disk-meta small { color:#86938d; font-size:10px; }
    .disk-space { padding-right:16px; }
    .disk-space__label { display:flex; justify-content:space-between; margin-bottom:7px; color:#697871; font-size:10px; }
    .disk-space__bar { height:5px; overflow:hidden; border-radius:5px; background:#e4ebe7; }
    .disk-space__bar i { display:block; height:100%; border-radius:inherit; background:#64a58b; }
    .disk-option:disabled .disk-space__bar i { background:#c7d0cc; }
    .disk-status { justify-self:end; padding:4px 7px; border-radius:4px; background:#eaf5ef; color:#39745d; font-size:10px; font-weight:700; }
    .disk-status.is-muted { background:#e9ecea; color:#7d8984; }
    .disk-status.is-error { background:#f5e9e4; color:#a56249; }
    .migration-selection { display:flex; align-items:center; justify-content:space-between; min-height:44px; margin-top:12px; padding:0 13px; border-radius:6px; background:#f6f9f7; color:#617169; font-size:11px; }
    .migration-selection strong { color:#386d59; font-size:13px; }
    .migration-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
    .migration-secondary { min-height:40px; padding:0 16px; border:1px solid #d7e1dc; border-radius:6px; background:#fff; color:#5d6e66; cursor:pointer; }
    .migration-workbench .migration-modal__action { min-width:104px; margin:0; }
    .dev-callout { position:relative; z-index:2; min-height:72px; margin-bottom:12px; padding:11px 12px 11px 42px; border:1px solid #dfe7e3; border-radius:7px; background:#fff; color:#65756e; font-size:11px; line-height:1.55; }
    .dev-callout b { display:block; margin-bottom:3px; color:#3f5149; font-size:12px; }
    .dev-callout__number, .dev-pin { display:grid; place-items:center; border-radius:50%; background:#d98263; color:#fff; font-size:10px; font-weight:750; }
    .dev-callout__number { position:absolute; left:12px; top:12px; width:20px; height:20px; }
    .dev-pin { position:absolute; z-index:3; width:20px; height:20px; box-shadow:0 0 0 3px #fff; }
    .migration-annotation-lines { position:absolute; z-index:1; inset:0; width:100%; height:100%; pointer-events:none; }
    .migration-annotation-lines path { fill:none; stroke:#d9a48f; stroke-width:1.2; stroke-dasharray:3 3; }
    .migration-progress-view { padding:22px; }
    .task-overview { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:20px; }
    .task-overview h4 { margin:0 0 6px; color:#33473f; font-size:17px; }
    .task-overview p { margin:0; color:#718079; font-size:12px; }
    .task-progress-number { color:#377b66; font-size:24px; font-weight:750; }
    .task-progress-bar { height:8px; margin-bottom:22px; overflow:hidden; border-radius:8px; background:#e5ece8; }
    .task-progress-bar i { display:block; width:56%; height:100%; border-radius:inherit; background:#4e9277; }
    .task-steps { display:grid; gap:0; }
    .task-step { position:relative; min-height:52px; padding:3px 0 12px 36px; color:#7a8881; font-size:11px; }
    .task-step::before { content:""; position:absolute; left:8px; top:5px; width:14px; height:14px; border:2px solid #c6d2cc; border-radius:50%; background:#fff; }
    .task-step::after { content:""; position:absolute; left:15px; top:22px; bottom:0; width:1px; background:#dce5e0; }
    .task-step:last-child::after { display:none; }
    .task-step.done::before { border-color:#4f9277; background:#4f9277; }
    .task-step.active { color:#3c5047; }
    .task-step.active::before { border:4px solid #4f9277; }
    .task-step b { display:block; margin-bottom:3px; color:inherit; font-size:12px; }
    .editor-toggle { position:fixed; z-index:12; top:24px; right:28px; min-height:36px; padding:0 14px; border:1px solid #cfe0d7; border-radius:6px; background:#fff; color:#356a57; font-size:12px; font-weight:700; cursor:pointer; box-shadow:0 5px 16px rgba(38,75,58,.08); }
    .editor-toggle:hover { background:#f0f7f3; }
    .editor-toggle.is-editing { border-color:#d98263; background:#fff8f5; color:#a45e47; }
    .text-editable[contenteditable="true"] { outline:1px dashed #d98263; outline-offset:3px; cursor:text; }
    .note-section { margin-top:42px; padding-top:24px; border-top:1px solid var(--line); }
    .note-section h2 { display:flex; align-items:center; gap:10px; margin:0 0 12px; color:#33453e; font-size:18px; }
    .note-section h2::before { content:""; width:4px; height:19px; border-radius:4px; background:var(--accent); }
    .note-field { display:block; width:100%; min-height:120px; resize:vertical; padding:14px 16px; border:1px solid #dfe7e3; border-radius:8px; background:#fff; color:#52615b; font:14px/1.8 inherit; }
    .note-field[readonly] { background:#f7faf8; color:#71807a; }
    .note-field:not([readonly]):focus { border-color:#5d927f; outline:3px solid rgba(93,146,127,.12); }
    .rule-list { display:grid; gap:10px; margin:0; padding:0; list-style:none; }
    .rule-list li { position:relative; padding-left:18px; color:#52615b; font-size:14px; line-height:1.75; }
    .rule-list li::before { content:""; position:absolute; left:0; top:9px; width:6px; height:6px; border-radius:50%; background:#d98263; }
    .prototype-window { position:relative; min-height:760px; overflow:hidden; border:1px solid #dfe6e3; border-radius:8px; background:#f7faf9; box-shadow:0 18px 48px rgba(43,63,56,.10); }
    .prototype-window--image { min-height:0; aspect-ratio:1884/956; background:#fff url("assets/client-assets-list.png") center/100% 100% no-repeat; }
    .legacy-hotspot { position:absolute; left:9.9%; width:90.1%; height:3.55%; z-index:1; padding:0; border:0; background:transparent; cursor:pointer; transition:background .16s ease,box-shadow .16s ease; }
    .legacy-hotspot:hover { background:rgba(73,166,232,.12); box-shadow:inset 0 1px rgba(73,166,232,.28),inset 0 -1px rgba(73,166,232,.28); }
    .legacy-hotspot:focus-visible { outline:2px solid #2e97df; outline-offset:-2px; background:rgba(73,166,232,.14); }
    .legacy-hotspot.selected { background:rgba(73,166,232,.16); }
    .client-context-menu { position:absolute; z-index:4; min-width:172px; padding:5px; border:1px solid #d9e3df; border-radius:7px; background:#fff; box-shadow:0 12px 26px rgba(30,49,41,.18); opacity:0; pointer-events:none; transform:translateY(-4px) scale(.98); transform-origin:top left; transition:opacity .14s ease,transform .14s ease; }
    .client-context-menu.is-open { opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
    .client-context-menu button { width:100%; height:34px; display:flex; align-items:center; gap:9px; padding:0 10px; border:0; border-radius:4px; background:transparent; color:#3d5048; font:600 12px/1 inherit; text-align:left; cursor:pointer; }
    .client-context-menu button::before { content:""; width:13px; height:13px; border:1.5px solid #5d927f; border-radius:50%; box-sizing:border-box; }
    .client-context-menu button:hover { background:#eff7f3; color:#2e6f59; }
    .client-context-menu button:focus-visible { outline:2px solid #5d927f; outline-offset:1px; }
    .prototype-window--image .drawer-backdrop { inset:0; }
    .prototype-window--image .hardware-drawer { top:50%; right:50%; bottom:auto; width:min(600px,calc(100% - 48px)); height:min(720px,calc(100% - 48px)); border:1px solid #dfe6e2; border-radius:10px; box-shadow:0 24px 70px rgba(24,43,35,.24); transform:translate(50%,-46%) scale(.96); opacity:0; transition:transform .28s cubic-bezier(.2,0,0,1),opacity .22s ease; }
    .prototype-window--image .hardware-drawer.is-open { transform:translate(50%,-50%) scale(1); opacity:1; }
    .app-bar { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; border-bottom:1px solid #e3e9e6; background:#fff; }
    .app-title { display:flex; align-items:center; gap:12px; font-size:15px; font-weight:700; }
    .app-title__mark { width:30px; height:30px; display:grid; place-items:center; border-radius:7px; background:#427c69; color:#fff; font-size:13px; }
    .app-context { color:#84908b; font-size:12px; font-weight:500; }
    .app-user { display:flex; align-items:center; gap:9px; color:#61706a; font-size:12px; }

<body>
  <div class="shell">
    <aside class="sidebar" aria-label="需求目录">

      <nav class="tree">
        <button class="date-row" id="dateToggle" type="button" aria-expanded="true" aria-controls="reqList"><span class="date-row__icon" aria-hidden="true">▾</span><span id="todayLabel">2026/8/6</span></button>

  <script>
    const now = new Date();
    const padDate = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
    document.getElementById('todayLabel').textContent = padDate;
    const requirements = [{ id:'req-1', title:'需求 1 · 客户机硬件详细查看功能' }, { id:'req-2', title:'需求 2 · 迁徙资源库' }];
    const list = document.getElementById('reqList');
    const content = document.getElementById('content');
    const shell = document.querySelector('.shell');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const dateToggle = document.getElementById('dateToggle');
    const editorToggle = document.getElementById('editorToggle');
    const clients = [
      {name:'FLQ',group:'默认分组',board:'B450M MORTAR MAX',cpu:'AMD Ryzen 5 2600X',gpu:'NVIDIA GeForce RTX 3060',network:'Realtek PCIe GbE',disk:'161 GB',memory:'8,192 MB',frequency:'2,667 MHz',monitor:'AOC',resolution:'2560 × 1440 / 75 Hz',mouse:'罗技 G502',keyboard:'罗技 G610',bios:'7B89v2I / 2024-03-18',mode:'UEFI',vt:'已开启',camera:'未检测到'},
      {name:'LJ72',group:'默认分组',board:'Z170I PRO GAMING',cpu:'Intel Core i7-6700',gpu:'NVIDIA GeForce GTX 1060',network:'Intel Ethernet',disk:'64 GB',memory:'8,192 MB',frequency:'2,133 MHz',monitor:'AOC',resolution:'1920 × 1080 / 60 Hz',mouse:'罗技',keyboard:'雷柏',bios:'2205 / 2023-08-11',mode:'UEFI',vt:'已开启',camera:'未检测到'},
      {name:'YJH01',group:'默认分组',board:'B560M GAMING',cpu:'11th Gen Intel Core i5',gpu:'NVIDIA GeForce RTX 3060',network:'Realtek PCIe GbE',disk:'107 GB + 256 GB',memory:'16,384 MB',frequency:'2,666 MHz',monitor:'AOC',resolution:'2560 × 1440 / 180 Hz',mouse:'雷蛇',keyboard:'雷蛇',bios:'F6 / 2024-06-02',mode:'UEFI',vt:'已开启',camera:'已连接'},
      {name:'YJH02',group:'默认分组',board:'B365 M AORUS',cpu:'Intel Core i5-9400F',gpu:'AMD Radeon RX 9060',network:'Intel Ethernet',disk:'161 GB',memory:'8,192 MB',frequency:'2,400 MHz',monitor:'AOC',resolution:'2560 × 1440 / 144 Hz',mouse:'罗技',keyboard:'罗技',bios:'F4 / 2023-12-17',mode:'UEFI',vt:'已开启',camera:'未检测到'},
      {name:'YJH03',group:'默认分组',board:'TUF B360M-PLUS',cpu:'Intel Core i5-8500',gpu:'NVIDIA GeForce RTX 2060',network:'Intel Ethernet',disk:'161 GB',memory:'8,192 MB',frequency:'2,666 MHz',monitor:'OST',resolution:'2560 × 1440 / 59 Hz',mouse:'双飞燕',keyboard:'双飞燕',bios:'1402 / 2023-09-06',mode:'UEFI',vt:'已开启',camera:'已连接'},
      {name:'ZHH',group:'邹海华',board:'B460M AORUS',cpu:'Intel Core i5-10400',gpu:'NVIDIA GeForce RTX 2060',network:'Intel Ethernet',disk:'214 GB + 250 GB',memory:'16,384 MB',frequency:'2,400 MHz',monitor:'OST',resolution:'2560 × 1440 / 75 Hz',mouse:'微软',keyboard:'微软',bios:'F5 / 2023-11-24',mode:'UEFI',vt:'已开启',camera:'已连接'}
    ];
    const detailRows = rows => rows.map(([label,value]) => `<div class="spec-row"><dt>${label}</dt><dd>${value}</dd></div>`).join('');
    const detailMarkup = client => `
      <section class="hardware-section"><h3>核心硬件</h3><dl class="spec-list">${detailRows([
        ['主板',client.board],['CPU',client.cpu],['显卡',client.gpu],['网卡',client.network]
      ])}</dl></section>
      <section class="hardware-section"><h3>存储与内存</h3><dl class="spec-list">${detailRows([
        ['硬盘',client.disk],['内存',client.memory],['内存频率',client.frequency]
      ])}</dl></section>
      <section class="hardware-section"><h3>显示与外设</h3><dl class="spec-list">${detailRows([
        ['显示器品牌',client.monitor],['显示器分辨率 / 刷新率',client.resolution],['鼠标品牌',client.mouse],['键盘品牌',client.keyboard],['摄像头',client.camera]
      ])}</dl></section>
      <section class="hardware-section"><h3>系统与虚拟化</h3><dl class="spec-list">${detailRows([
        ['BIOS 版本 / 日期',client.bios],['BIOS 模式',client.mode],['VT 虚拟化','<span class="state-on">'+client.vt+'</span>']
      ])}</dl></section>`;
    const prdMarkup = `<section class="prd-document" aria-label="需求文档">
      <div class="prd-module"><h2>需求背景</h2><div class="prd-module__content"><p>当前客户机资产列表字段过多，导致长列表横向滚动频繁。网管在排查单机硬件问题时，定位信息效率低，且看串行容易误判。</p></div></div>
      <div class="prd-module"><h2>设计目标</h2><div class="prd-module__content"><p>通过双击打开详情面板，把单台客户机的硬件配置汇总展示。</p></div></div>
      <div class="prd-module"><h2>功能详述</h2><div class="prd-module__content"><p>路径：客户机管理→客户机资产列表</p><p>功能1：查看客户机硬件详情</p><p>双击列表中的单条数据，即可打开硬件详情</p><p>右键列表中的单条数据，弹出菜单，点击“查看客户机详情”即可打开详情</p></div></div>
    </section><h2 class="prototype-section-title">硬件详情</h2>`;
    const legacyMarkup = client => `<div class="legacy-hotspots">${['28.05%','31.35%','34.65%','37.95%','41.25%','44.55%'].map((top,index) => `<button class="legacy-hotspot" style="top:${top}" type="button" data-client="${index}" aria-label="查看 ${clients[index].name} 硬件详情"></button>`).join('')}</div><div class="client-context-menu" id="clientContextMenu" role="menu"><button type="button" id="viewClientDetail" role="menuitem">查看客户机详情</button></div><div class="drawer-backdrop" id="drawerBackdrop"></div><aside class="hardware-drawer" id="hardwareDrawer" aria-label="客户机硬件详情"><div class="drawer-head"><div><div class="drawer-kicker">客户机硬件详情</div><h2 class="drawer-title" id="drawerTitle">${client.name}</h2><span class="drawer-group" id="drawerGroup">${client.group}</span></div><button class="icon-button" id="drawerClose" type="button" aria-label="关闭详情">×</button></div><div class="drawer-body" id="drawerBody">${detailMarkup(client)}</div></aside>`;
    function renderHardwarePrototype() {
      const first = clients[0];
      content.innerHTML = `<div class="content-view"><div class="prototype-heading"><div><div class="eyebrow">${padDate} / 需求 1</div><h1>客户机硬件详细查看功能</h1></div><div class="prototype-path">客户机管理  /  客户机资产列表</div></div><div class="prototype-window"><div class="app-bar"><div class="app-title"><span class="app-title__mark">机</span><span>客户机资产列表</span><span class="app-context">共 3 台</span></div><span class="app-user">系统正常</span></div><div class="asset-layout"><aside class="asset-nav"><div class="asset-nav__label">客户机管理</div><div class="asset-nav__item">客户机分组</div><div class="asset-nav__item active">客户机资产</div><div class="asset-nav__item">资产变更记录</div></aside><section class="asset-main"><div class="asset-toolbar"><h2>客户机资产<span class="asset-count">3 台</span></h2><input class="search" aria-label="搜索客户机" placeholder="搜索客户机名称"></div><div class="asset-table-shell"><table class="asset-table"><thead><tr><th style="width:18%">客户机名称</th><th style="width:16%">所在分组</th><th style="width:24%">主板</th><th style="width:23%">CPU</th><th style="width:19%">运行状态</th></tr></thead><tbody>${clients.map((client,index) => `<tr tabindex="0" class="${index===0?'selected':''}" data-client="${index}"><td class="device-name">${client.name}</td><td>${client.group}</td><td title="${client.board}">${client.board}</td><td title="${client.cpu}">${client.cpu}</td><td><span class="online">在线</span></td></tr>`).join('')}</tbody></table></div></section></div><div class="drawer-backdrop is-open" id="drawerBackdrop"></div><aside class="hardware-drawer is-open" id="hardwareDrawer" aria-label="客户机硬件详情"><div class="drawer-head"><div><div class="drawer-kicker">客户机硬件详情</div><h2 class="drawer-title" id="drawerTitle">${first.name}</h2><span class="drawer-group" id="drawerGroup">${first.group}</span></div><button class="icon-button" id="drawerClose" type="button" aria-label="关闭详情">×</button></div><div class="drawer-body" id="drawerBody">${detailMarkup(first)}</div></aside></div></div>`;
      content.querySelector('.prototype-path')?.remove();
      content.querySelector('.prototype-heading').insertAdjacentHTML('afterend', prdMarkup);
      const prototypeWindow = content.querySelector('.prototype-window');
      prototypeWindow.classList.add('prototype-window--image');
      prototypeWindow.innerHTML = legacyMarkup(first);
      prototypeWindow.innerHTML = prototypeWindow.innerHTML.replaceAll('客户机硬件详情', '客户机详情').replaceAll('硬件详情', '客户机详情');
      content.querySelector('.prototype-section-title').textContent = '客户机详情';
      content.querySelectorAll('.prd-module__content p').forEach(paragraph => { if (paragraph.textContent.trim().startsWith('功能1：')) paragraph.remove(); });
      Array.from(content.querySelectorAll('.prd-module__content p')).find(paragraph => paragraph.textContent.trim() === '双击列表中的单条数据，即可打开硬件详情')?.insertAdjacentHTML('afterend', '<p>显示字段与列表字段相同</p>');
      const drawer = document.getElementById('hardwareDrawer');
      drawer.setAttribute('role', 'dialog');
      drawer.setAttribute('aria-modal', 'true');
      const backdrop = document.getElementById('drawerBackdrop');
      const contextMenu = document.getElementById('clientContextMenu');
      let contextClientIndex = 0;
      const closeDrawer = () => { drawer.classList.remove('is-open'); backdrop.classList.remove('is-open'); };
      const closeContextMenu = () => contextMenu.classList.remove('is-open');
      const openContextMenu = (event, index) => {
        event.preventDefault();
        contextClientIndex = Number(index);
        const bounds = prototypeWindow.getBoundingClientRect();
        const maxLeft = bounds.width - 180;
        const maxTop = bounds.height - 46;
        contextMenu.style.left = `${Math.max(8, Math.min(event.clientX - bounds.left, maxLeft))}px`;
        contextMenu.style.top = `${Math.max(8, Math.min(event.clientY - bounds.top, maxTop))}px`;
        contextMenu.classList.add('is-open');
      };
      const openDrawer = index => { const client = clients[index]; document.getElementById('drawerTitle').textContent = client.name; document.getElementById('drawerGroup').textContent = client.group; document.getElementById('drawerBody').innerHTML = detailMarkup(client); drawer.classList.add('is-open'); backdrop.classList.add('is-open'); document.querySelectorAll('.legacy-hotspot').forEach(row => row.classList.toggle('selected', row.dataset.client === String(index))); };
      document.querySelectorAll('.legacy-hotspot').forEach(row => { row.addEventListener('dblclick', () => openDrawer(row.dataset.client)); row.addEventListener('contextmenu', event => openContextMenu(event, row.dataset.client)); row.addEventListener('keydown', event => { if (event.key === 'Enter') openDrawer(row.dataset.client); }); });
      document.getElementById('viewClientDetail').addEventListener('click', () => { closeContextMenu(); openDrawer(contextClientIndex); });
      prototypeWindow.addEventListener('click', event => { if (!contextMenu.contains(event.target)) closeContextMenu(); });
      document.getElementById('drawerClose').addEventListener('click', closeDrawer);
      backdrop.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDrawer(); }, {once:true});
    }

      content.innerHTML = `<article class="content-view migration-document"><div class="eyebrow">${padDate} / 需求 2</div><h1>迁徙资源库</h1><p class="migration-lead">通过可视化界面将“系统更新”资源库迁移到指定盘符，降低机械盘在系统更新阶段的读写压力。</p><section class="migration-section"><h2>需求背景</h2><p>网吧服务器同时使用固态盘和大容量机械盘。系统更新资源库落在机械盘时，系统更新下载会拉高机械盘压力，开机资源可能长时间无法刷出。</p><p>当前可通过设置下载盘、删除原文件后触发重新下载处理，但操作步骤多，且会造成重复下载。用户希望提供一键操作。</p></section><section class="migration-section"><h2>设计目标</h2><p>管理员选择目标盘后，系统在后台完成资源库复制、校验、路径切换和旧文件清理。用户不需要停留在页面等待，BS 不重启。</p></section><section class="migration-section"><h2>操作入口</h2><p>按钮名称：迁徙资源库</p><p>操作对象：系统更新文件夹</p><p>目标目录：目标盘符下的系统更新文件夹</p></section><section class="migration-section"><h2>后台任务路线图</h2><div class="flowchart-scroll" aria-label="迁徙资源库后台任务路线图"><div class="flowchart-board"><svg class="flowchart-svg" viewBox="0 0 1760 450" aria-hidden="true"><defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#80a393"></path></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d48a71"></path></marker></defs><path marker-end="url(#flow-arrow)" d="M120 132 H160"></path><path marker-end="url(#flow-arrow)" d="M314 132 H354"></path><path marker-end="url(#flow-arrow)" d="M514 132 H554"></path><path marker-end="url(#flow-arrow)" d="M708 132 H748"></path><path marker-end="url(#flow-arrow)" d="M902 132 H942"></path><path marker-end="url(#flow-arrow)" d="M1096 132 H1136"></path><path marker-end="url(#flow-arrow)" d="M1290 132 H1330"></path><path marker-end="url(#flow-arrow)" d="M1484 132 H1524"></path><path marker-end="url(#flow-arrow)" d="M1284 132 H1330"></path><path marker-end="url(#flow-arrow)" d="M1484 132 H1524"></path><path class="flow-return" marker-end="url(#return-arrow)" d="M434 195 V286 H310 V330"></path><path class="flow-return" marker-end="url(#return-arrow)" d span><span class="disk-meta"><strong>固态硬盘 SSD</strong><small>SATA · Kingston SA400</small></span><span class="disk-space"><span class="disk-space__label"><span>剩余 92 GB</span><span>238 GB</span></span><span class="disk-space__bar"><i style="width:39%"></i></span></span><span class="disk-status is-error">空间不足</span></button></div><div class="migration-selection"><span>迁徙至 <strong>E:\系统更新</strong></span><span>完成后预计剩余 <strong>138.6 GB</strong></span></div><div class="migration-actions"><button type="button" class="migration-secondary migration-cancel">取消</button><button type="button" class="migration-modal__action migration-start">开始迁徙</button></div></section><aside class="migration-dev-pane"><h4>研发实现说明</h4><div class="dev-callout"><span class="dev-callout__number">1</span><b>容量口径</b>已占用 + 下载任务未完成大小 + 安全预留；不得重复计算已落盘部分。</div><div class="dev-callout"><span class="dev-callout__number">2</span><b>磁盘信息</b>展示盘符、SSD/HDD、设备型号、剩余/总容量；识别失败显示“类型未知”。</div><div class="dev-callout"><span class="dev-callout__number">3</span><b>禁用规则</b>原盘、空间不足、只读、离线均置灰，状态标签必须显示具体原因。</div><div class="dev-callout"><span class="dev-callout__number">4</span><b>选择反馈</b>选中后即时计算目标路径和迁徙完成后的预计剩余空间。</div><div class="dev-callout"><span class="dev-callout__number">5</span><b>按钮条件</b>目标盘有效且当前无迁徙任务时启用；点击后再次执行空间预检。</div><div class="dev-callout"><span class="dev-callout__number">6</span><b>后台任务</b>关闭弹窗不终止任务；入口改为“迁徙中 + 百分比”，可重新打开查看。</div></aside><span class="dev-pin" style="left:712px;top:48px">1</span><span class="dev-pin" style="left:712px;top:150px">2</span><span class="dev-pin" style="left:712px;top:360px">3</span><span class="dev-pin" style="left:712px;top:474px">4</span><span class="dev-pin" style="left:712px;top:535px">5</span><span class="dev-pin" style="left:712px;top:594px">6</span><svg class="migration-annotation-lines" viewBox="0 0 1160 650" preserveAspectRatio="none" aria-hidden="true"><path d="M722 58 C760 58 770 64 790 64"></path><path d="M722 160 C760 160 770 146 790 146"></path><path d="M722 370 C760 370 770 230 790 230"></path><path d="M722 484 C760 484 770 314 790 314"></path><path d="M722 545 C760 545 770 398 790 398"></path><path d="M722 604 C760 604 770 482 790 482"></path></svg></div></div></div>`);
      const modal = document.querySelector('.migration-modal-backdrop');
      const close = () => modal.remove();
      modal.addEventListener('click', event => { if (event.target === modal) close(); });

      modal.querySelector('.migration-cancel').addEventListener('click', close);

        const layout = modal.querySelector('.migration-workbench__layout');
        layout.innerHTML = `<section class="migration-config-pane migration-progress-view"><div class="task-overview"><div><h4>正在复制系统更新资源库</h4><p>D:\系统更新 → E:\系统更新 · 后台任务</p></div><div class="task-progress-number">56%</div></div><div class="task-progress-bar"><i></i></div><div class="task-steps"><div class="task-step done"><b>检查目标盘</b>空间、写入权限和目标路径检查通过</div><div class="task-step active"><b>复制资源库</b>已复制 68.2 GB / 120 GB · 82 MB/s</div><div class="task-step"><b>等待当前下载完成</b>显示剩余下载任务数量，不展示虚假百分比</div><div class="task-step"><b>补复制新增文件</b>同步首次复制期间新增或变化的文件</div><div class="task-step"><b>校验文件</b>按文件数量、大小和完整性显示进度</div><div class="task-step"><b>切换路径并验证</b>动态更新资源库路径并确认 BS 可读取</div><div class="task-step"><b>完成</b>恢复下载，后续文件写入新盘</div></div><div class="migration-actions"><button type="button" class="migration-secondary task-close">关闭弹窗，后台继续</button></div></section><aside class="migration-dev-pane"><h4>执行态说明</h4><div class="dev-callout"><span class="dev-callout__number">1</span><b>总体进度</b>只在可计算字节的阶段显示百分比，同时展示已完成/总大小和速度。</div><div class="dev-callout"><span class="dev-callout__number">2</span><b>等待状态</b>等待当前下载结束时使用动态状态，并显示剩余任务数，不冻结在某个百分比。</div><div class="dev-callout"><span class="dev-callout__number">3</span><b>阶段明细</b>复制、等待、补复制、校验、切换、验证分别记录状态与失败原因。</div><div class="dev-callout"><span class="dev-callout__number">4</span><b>离开页面</b>任务由后台执行。重新打开弹窗时必须读取真实任务状态，不从头播放。</div></aside>`;

    function ensureNoteSection(reqId) { let note = content.querySelector('.note-section'); if (!note) { content.querySelector('.content-view')?.insertAdjacentHTML('beforeend', `<section class="note-section"><h2>备注</h2><textarea class="note-field" readonly placeholder="开启编辑模式后输入备注"></textarea></section>`); note = content.querySelector('.note-section'); } try { note.querySelector('.note-field').value = localStorage.getItem(`prototype-note-${reqId}`) || ''; } catch (error) {} }
    function directoryTargets() { return [document.getElementById('todayLabel'), ...Array.from(document.querySelectorAll('.req-btn'))].filter(Boolean); }
    function applySavedDirectory() { try { const saved = JSON.parse(localStorage.getItem('prototype-directory') || '{}'); const date = document.getElementById('todayLabel'); if (saved.date) date.textContent = saved.date; document.querySelectorAll('.req-btn').forEach((button, index) => { if (saved[index]) button.textContent = saved[index]; }); } catch (error) {} }
    function editableTargets() { return Array.from(content.querySelectorAll('h1,h2,h3,h4,p,li,strong,small,dt,dd')).filter(node => !node.closest('.flowchart-svg') && !node.closest('.note-section')); }
    function applySavedText(reqId) { try { const saved = JSON.parse(localStorage.getItem(`prototype-text-${reqId}`) || '{}'); editableTargets().forEach((node, index) => { if (Object.prototype.hasOwnProperty.call(saved, index)) node.textContent = saved[index]; }); } catch (error) {} ensureNoteSection(reqId); applySavedDirectory(); }
    function setEditMode(enabled) { const targets = [...editableTargets(), ...directoryTargets()]; targets.forEach(node => { node.classList.toggle('text-editable', enabled); node.contentEditable = enabled ? 'true' : 'false'; node.spellcheck = false; }); const note = content.querySelector('.note-field'); if (note) note.readOnly = !enabled; editorToggle.classList.toggle('is-editing', enabled); editorToggle.textContent = enabled ? '保存文字' : '开启编辑模式'; editorToggle.setAttribute('aria-pressed', String(enabled)); }
    function saveEditedText() { const reqId = content.querySelector('.eyebrow')?.textContent?.includes('需求 2') ? 'req-2' : 'req-1'; const values = {}; editableTargets().forEach((node, index) => { values[index] = node.textContent; }); const directory = {date: document.getElementById('todayLabel').textContent}; document.querySelectorAll('.req-btn').forEach((button, index) => { directory[index] = button.textContent; }); try { localStorage.setItem(`prototype-text-${reqId}`, JSON.stringify(values)); localStorage.setItem('prototype-directory', JSON.stringify(directory)); const note = content.querySelector('.note-field'); if (note) localStorage.setItem(`prototype-note-${reqId}`, note.value); } catch (error) {} setEditMode(false); }
    editorToggle.addEventListener('click', () => { if (editorToggle.classList.contains('is-editing')) saveEditedText(); else setEditMode(true); });
    function render(id) { const req = requirements.find(item => item.id === id) || requirements[0]; setEditMode(false); document.querySelectorAll('.req-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.id === req.id)); if (req.id === 'req-1') { renderHardwarePrototype(); applySavedText(req.id); return; } if (req.id === 'req-2') { renderMigrationRequirement(); applySavedText(req.id); return; } content.innerHTML = `<div class="content-view empty-view"><div class="eyebrow">${padDate}</div><h1>${req.title}</h1><div class="rule"></div></div>`; applySavedText(req.id); }
    requirements.forEach((req, index) => { const btn = document.createElement('button'); btn.className = 'req-btn' + (index === 0 ? ' active' : ''); btn.dataset.id = req.id; btn.textContent = req.title; btn.addEventListener('click', () => { if (!editorToggle.classList.contains('is-editing')) render(req.id); }); list.appendChild(btn); });
    sidebarToggle.addEventListener('click', () => {
      const collapsed = shell.classList.toggle('sidebar-collapsed');
      sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
      sidebarToggle.setAttribute('aria-label', collapsed ? '显示需求目录' : '隐藏需求目录');
    });
    dateToggle.addEventListener('click', () => {
      if (editorToggle.classList.contains('is-editing')) return;
      const hidden = list.classList.toggle('is-hidden');
      dateToggle.setAttribute('aria-expanded', String(!hidden));
    });
    render('req-1');
  </script>
